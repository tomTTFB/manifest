<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest</title>
<style>
  /* CC:Tweaked's palette, with the green startup.lua repalettes on boot */
  :root {
    --black: #111111;
    --white: #f0f0f0;
    --light: #999999;
    --grey: #4c4c4c;
    --green: #6abe5c;
    --red: #cc4c4c;
    --line: #1e1e1e;
    --hover: #1c1c1c;
    --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --row: 20px;
    --pad: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font: 13px/1.2 var(--mono);
    overflow-x: hidden;
  }

  .top { position: sticky; top: 0; z-index: 2; background: var(--black); }

  header {
    display: flex;
    align-items: center;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    padding: 4px var(--pad) 4px 6px;
  }

  .brand { padding: 5px 10px; color: var(--light); letter-spacing: 2px; }

  nav { display: flex; gap: 2px; flex: 1; }

  nav button, .bar button {
    font: inherit;
    border: 0;
    cursor: pointer;
    background: var(--grey);
    color: var(--white);
  }

  nav button { padding: 5px 14px; }
  nav button[aria-selected="true"] { background: var(--green); color: var(--black); }

  .link { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--light); }
  .dot { width: 10px; height: 10px; background: var(--red); flex: none; }
  .link.up .dot { background: var(--green); }

  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 5px var(--pad) 5px 6px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .field { position: relative; display: flex; flex: 0 1 46ch; min-width: 18ch; }

  input {
    font: inherit;
    width: 100%;
    padding: 5px 30px 5px 8px;
    border: 0;
    background: var(--grey);
    color: var(--white);
  }

  input::placeholder { color: var(--light); }
  input:focus { outline: 2px solid var(--green); outline-offset: -2px; }

  .clear {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 28px;
    border: 0;
    cursor: pointer;
    background: none;
    color: var(--light);
    font: inherit;
  }

  .clear:hover { color: var(--white); }

  .bar button.sort { padding: 5px 12px; }
  .bar button.sort[aria-pressed="true"] { background: var(--green); color: var(--black); }

  .summary { color: var(--light); margin-left: auto; white-space: nowrap; }

  /* the monitor splits into columns once it is wide enough, and 34 characters
     is the width it calls too narrow to bother. same rule here. */
  ul { list-style: none; margin: 0; padding: 0; }

  /* Fills a column to the bottom of the window before starting the next, so a
     short list stays a short list instead of smearing across the whole width. */
  #items {
    display: grid;
    grid-auto-flow: column;
    column-gap: 20px;
    padding-right: var(--pad);
  }

  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    height: var(--row);
    padding: 0 8px 0 10px;
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }

  li:hover { background: var(--hover); }

  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li b { font-weight: normal; color: var(--green); white-space: nowrap; }

  .empty { height: auto; padding: 16px 10px; color: var(--grey); }
  .empty:hover { background: none; }

  h2 {
    font: inherit;
    color: var(--light);
    margin: 0;
    padding: 12px 10px 4px;
  }

  .tag { color: var(--green); }
  .state-unreadable { color: var(--red); }
  .state-ready { color: var(--grey); }
  .state-busy, .state-finished { color: var(--light); }

  footer {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    padding: 5px var(--pad);
    background: var(--black);
    border-top: 1px solid var(--line);
    color: var(--grey);
  }

  footer.stale { opacity: 0.45; }
  footer span b { font-weight: normal; color: var(--light); }
</style>
</head>
<body>

<div class="top">
  <header>
    <span class="brand">MANIFEST</span>
    <nav>
      <button data-tab="manifest" aria-selected="true">Manifest</button>
      <button data-tab="spatial" aria-selected="false">Spatial</button>
    </nav>
    <span class="link" id="link"><i class="dot"></i><span id="linkText">connecting</span></span>
  </header>

  <div class="bar" id="searchbar">
    <span class="field">
      <input id="q" placeholder="search" autocomplete="off" spellcheck="false" autofocus>
      <button class="clear" id="clear" hidden title="clear (esc)">&times;</button>
    </span>
    <button class="sort" id="byName" aria-pressed="true">name</button>
    <button class="sort" id="byCount" aria-pressed="false">count</button>
    <span class="summary" id="summary"></span>
  </div>
</div>

<main>
  <section id="manifest"><ul id="items"></ul></section>
  <section id="spatial" hidden></section>
</main>

<footer id="stats"></footer>

<script>
const state = { items: [], stats: {}, spatial: null, output: null };
const sort = { key: "name", dir: 1 };
let query = "";
let lastTick = 0;

const ROW = 20;        // must match --row
const MIN_COL = 260;   // narrower than this and names start truncating

const $ = id => document.getElementById(id);
const commas = n => n.toLocaleString("en-GB");
const arrow = key => sort.key !== key ? "" : (sort.dir > 0 ? " ↑" : " ↓");

function matching() {
  if (!query) return state.items;
  const needle = query.toLowerCase();
  return state.items.filter(([id, name]) =>
    name.toLowerCase().includes(needle) || id.includes(needle));
}

function drawItems() {
  const rows = matching().slice();
  // ties in a count sort fall back to name, so the order never depends on
  // whatever order the feed happened to arrive in
  rows.sort(sort.key === "count"
    ? (a, b) => (b[2] - a[2]) * sort.dir || a[1].localeCompare(b[1])
    : (a, b) => a[1].localeCompare(b[1]) * sort.dir);

  const all = state.items.length;
  $("summary").textContent = query
    ? `${rows.length} of ${all}`
    : all + (all === 1 ? " type" : " types");

  $("byName").textContent = "name" + arrow("name");
  $("byCount").textContent = "count" + arrow("count");
  $("clear").hidden = !query;

  if (!rows.length) {
    shape(1, 1);
    $("items").innerHTML = '<li class="empty">' +
      (all ? "nothing matches " + query : "waiting for a scan") + "</li>";
    return;
  }

  shape(rows.length, fitRows());
  $("items").innerHTML = rows.map(([id, name, count]) =>
    `<li title="${id}"><span class="name">${name}</span><b>${commas(count)}</b></li>`).join("");
}

function fitRows() {
  const chrome = document.querySelector(".top").offsetHeight + $("stats").offsetHeight;
  return Math.max(4, Math.floor((window.innerHeight - chrome) / ROW));
}

// Down the window first, then across. Columns are only added once a column is
// full, and never more than the width can hold, so it never scrolls sideways.
function shape(n, perColumn) {
  const widest = Math.max(1, Math.floor(window.innerWidth / MIN_COL));
  const rows = Math.max(perColumn, Math.ceil(n / widest));
  const cols = Math.ceil(n / rows);

  const grid = $("items").style;
  grid.gridTemplateRows = `repeat(${rows}, ${ROW}px)`;
  grid.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
}

function drawSpatial() {
  const s = state.spatial;

  if (!s) {
    $("spatial").innerHTML = '<p class="empty">No cell barrel set. Pick one on the monitor.</p>';
    return;
  }

  const ports = (s.ports || []).map(p =>
    `<li><span class="name">${p.name}</span><span class="state-${p.state}">${p.state}</span></li>`).join("");

  const cells = (s.cells || []).map(c =>
    `<li><span class="name">${c.label}</span>${c.loaded ? '<span class="tag">loaded</span>' : ""}</li>`).join("");

  $("spatial").innerHTML =
    "<h2>Spatial IO</h2><ul>" + (ports || '<li class="empty">No ports on the network</li>') + "</ul>" +
    `<h2>Cells in ${s.barrel}</h2><ul>` +
    (s.cells ? (cells || '<li class="empty">no cells in the barrel</li>')
             : '<li class="empty state-unreadable">barrel unreadable</li>') + "</ul>";
}

function drawStats() {
  const s = state.stats;
  let total = 0;
  for (const item of state.items) total += item[2];

  const bits = [
    ["chests", s.chests || "-"],
    ["items", commas(total)],
    ["scan", s.elapsed == null ? "-" : s.elapsed + "ms"],
    ["json", s.json == null ? "-" : s.json + "ms"],
    ["every", s.interval == null ? "-" : s.interval + "s"],
    ["output", state.output || "none"],
  ];
  $("stats").innerHTML = bits.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("");
}

// the computer ticks twice a second, so silence for longer than a couple of
// ticks means it stopped rather than that nothing changed
function drawLink() {
  const up = lastTick && Date.now() - lastTick < 2500;
  $("link").classList.toggle("up", up);
  $("stats").classList.toggle("stale", !up);
  $("linkText").textContent = up ? "live" : (lastTick ? "no ticks" : "connecting");
}

const events = new EventSource("/api/events");

events.onmessage = e => {
  const msg = JSON.parse(e.data);
  const fresh = msg.items !== undefined;

  Object.assign(state, msg);
  lastTick = Date.now();

  if (fresh) drawItems();
  drawSpatial();
  drawStats();
  drawLink();
};

function search(text) {
  query = text;
  $("q").value = text;
  drawItems();
}

$("q").addEventListener("input", e => search(e.target.value));
$("clear").addEventListener("click", () => { search(""); $("q").focus(); });

for (const [id, key] of [["byName", "name"], ["byCount", "count"]]) {
  $(id).addEventListener("click", () => {
    // clicking the sort you are already on turns it round
    sort.dir = sort.key === key ? -sort.dir : 1;
    sort.key = key;
    $("byName").ariaPressed = String(key === "name");
    $("byCount").ariaPressed = String(key === "count");
    drawItems();
  });
}

for (const button of document.querySelectorAll("nav button")) {
  button.addEventListener("click", () => {
    const manifest = button.dataset.tab === "manifest";
    for (const other of document.querySelectorAll("nav button")) {
      const on = other === button;
      other.ariaSelected = String(on);
      $(other.dataset.tab).hidden = !on;
    }
    $("searchbar").hidden = !manifest;
  });
}

// typing anywhere should land in the search box, the way it does on the monitor
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return search("");
  if (e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return;
  if (document.activeElement !== $("q")) $("q").focus();
});

window.addEventListener("resize", drawItems);

setInterval(drawLink, 500);
drawItems();
drawStats();
</script>
</body>
</html>
